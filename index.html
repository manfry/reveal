<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gender Reveal</title>
    <!-- Google Fonts per una tipografia elegante -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Canvas per lo sfondo animato con particelle e per i coriandoli -->
    <canvas id="bg-canvas"></canvas>
    <canvas id="confetti-canvas"></canvas>

    <!-- Contenitore Principale -->
    <main class="container">
        <div class="glass-card" id="main-card">
            
            <!-- Header -->
            <h1 id="main-title">Il grande momento sta arrivando...</h1>
            <p id="subtitle" class="subtitle">Manca sempre meno per scoprire chi sta arrivando...</p>

            <!-- Countdown -->
            <div id="countdown-container" class="countdown-grid">
                <div class="time-box">
                    <span id="days" class="time-value">00</span>
                    <span class="time-label">Giorni</span>
                </div>
                <div class="separator">:</div>
                <div class="time-box">
                    <span id="hours" class="time-value">00</span>
                    <span class="time-label">Ore</span>
                </div>
                <div class="separator">:</div>
                <div class="time-box">
                    <span id="minutes" class="time-value">00</span>
                    <span class="time-label">Minuti</span>
                </div>
                <div class="separator">:</div>
                <div class="time-box">
                    <span id="seconds" class="time-value">00</span>
                    <span class="time-label">Secondi</span>
                </div>
            </div>

            <!-- Sezione Reveal (nascosta finché il countdown non arriva a zero) -->
            <div id="reveal-container" class="hidden">
                <button id="reveal-btn" class="glow-button">SCOPRI</button>
            </div>

            <!-- Messaggio Finale (nascosto fino al click su SCOPRI) -->
            <div id="result-container" class="hidden">
                <h2 id="result-text" class="result-title"></h2>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
