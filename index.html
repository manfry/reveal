<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gender Reveal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <main class="page">
    <section class="card">
      <div class="decor d1">✦</div><div class="decor d2">✧</div><div class="decor d3">♡</div>

      <div id="intro">
        <p class="eyebrow">Il grande momento sta arrivando</p>
        <h1 id="title"></h1>
        <p class="subtitle" id="subtitle"></p>
        <div class="countdown">
          <div><strong id="days">00</strong><span>giorni</span></div><i>:</i>
          <div><strong id="hours">00</strong><span>ore</span></div><i>:</i>
          <div><strong id="minutes">00</strong><span>minuti</span></div><i>:</i>
          <div><strong id="seconds">00</strong><span>secondi</span></div>
        </div>
        <p class="hint" id="dateHint"></p>
      </div>

      <div id="discover" hidden>
        <p class="eyebrow">Il momento è arrivato!</p>
        <h2>Pronti a scoprire?</h2>
        <p class="subtitle">La sorpresa è nelle vostre mani…</p>
        <button id="discoverButton" type="button">SCOPRI</button>
      </div>

      <div id="result" hidden>
        <p class="eyebrow">La sorpresa è arrivata!</p>
        <h2 id="resultText"></h2>
        <p class="subtitle" id="resultMessage"></p>
      </div>
    </section>
  </main>
  <canvas id="confettiCanvas"></canvas>
  <canvas id="bg-canvas"></canvas>
  <script src="script.js"></script>
</body>
</html>
